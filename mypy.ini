[mypy]
plugins = pydantic.mypy
ignore_missing_imports = True

# 프로덕션 코드(app/*)에서 타입 힌트 없는 함수 정의를 금지한다 - mypy 기본값은
# 시그니처가 아예 없는 함수 본문은 검사하지 않고 조용히 통과시키므로, 새 함수를
# 힌트 없이 추가해도 CI가 못 잡아냈다. tests/*는 테스트 함수 하나하나에 반환
# 타입(-> None)을 붙이는 관행이 없는 이 프로젝트 스타일과 맞지 않아 제외한다.
[mypy-app.*]
disallow_untyped_defs = True
