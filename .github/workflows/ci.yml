name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치/PR에 짧은 간격으로 커밋이 여러 번 push되면(이 저장소는 로드맵 자동
# 개발 루프가 시간마다 push하는 브랜치가 있음), 취소 없이는 과거 커밋에 대한 실행이
# 전부 끝까지 돌아 CI 분(minute)을 낭비한다 - 최신 커밋 결과만 의미 있으므로, 같은
# ref에 새 실행이 시작되면 그 ref의 진행 중이던 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Type check (mypy)
        run: mypy app tests

      - name: Run tests
        # 커버리지가 90% 밑으로 떨어지면 빌드를 실패시킨다. 현재 실제 커버리지(~95%)보다
        # 살짝 낮게 잡아서, 사소한 변동에 CI가 계속 깨지지 않도록 여유를 뒀다.
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Dependency vulnerability scan for dev tools (pip-audit)
        # requirements.txt는 이미 위에서 감사했으니, 여기서는 requirements-dev.txt가
        # 추가로 얹는 개발/CI 전용 패키지(pytest, mypy, pip-audit 자신, aiosqlite 등)만
        # 따로 확인한다. 운영에는 배포되지 않는 도구들이지만, CI 실행 환경 자체를
        # 공급망 공격으로부터 지키는 것도 의미가 있다 - 지금까지는 이 파일 전체가
        # pip-audit 대상에서 아예 빠져 있었다.
        run: pip-audit -r requirements-dev.txt

  migrations:
    # 테스트는 db_session_factory 픽스처가 Base.metadata.create_all()로 SQLite에
    # 스키마를 직접 만들어서 쓰기 때문에(마이그레이션 체인을 완전히 건너뜀), test
    # job이 전부 통과해도 alembic 마이그레이션이 실제 모델과 어긋나 있을 수 있다 -
    # 운영은 create_all이 아니라 이 마이그레이션들로 스키마를 만들므로, 여기서
    # 놓치면 배포 시점에야 스키마 불일치가 드러난다. alembic check는 실제 DB
    # 연결이 있어야 하고(alembic/env.py가 DATABASE_URL로 엔진을 만듦) SQLite가
    # 아닌 운영과 같은 Postgres 방언이어야 신뢰할 수 있어 서비스 컨테이너로 띄운다.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haruhan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haruhan
      # Settings.jwt_secret_key는 32자 이상을 요구한다 - 이 job은 서버를 띄우지
      # 않고 alembic만 돌리지만 get_settings()가 Settings()를 생성하는 순간
      # 검증이 걸리므로 형식만 맞는 더미 값을 준다.
      JWT_SECRET_KEY: ci-only-dummy-secret-key-not-for-production-use
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check for model/migration drift
        run: alembic check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSLf -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Run gitleaks
        run: ./gitleaks detect --source=. --redact -v
