version: '3.8'

services:
  haruhan-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haruhan-backend
    restart: unless-stopped
    # 외부 접근은 caddy가 대신 받으므로 호스트 포트를 열어두지 않는다
    # (필요하면 디버깅용으로 "18000:8000"을 임시로 되살려도 됨).
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - API_KEY=${API_KEY:-}
      - CHAT_RATE_LIMIT=${CHAT_RATE_LIMIT:-10/minute}
      - MAX_PROMPT_LENGTH=${MAX_PROMPT_LENGTH:-4000}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      # 비워두면(.env에서 REDIS_URL 미설정) 아래 내장 redis 서비스를 기본으로 쓴다.
      # 외부 관리형 Redis를 쓰려면 .env에 REDIS_URL을 직접 채워 이 기본값을 덮어쓰면 된다.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    networks:
      - haruhan-net
      - mindul-net

  redis:
    image: redis:7-alpine
    container_name: haruhan-redis
    restart: unless-stopped
    # 레이트리밋 카운터는 휘발성 데이터라 영속 볼륨이 필요 없다. 메모리 상한 + LRU
    # 축출 정책만 걸어서 무한정 커지는 것을 막는다. 외부 포트는 열지 않는다
    # (haruhan-backend에서만 내부 네트워크로 접근).
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - haruhan-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: haruhan-prometheus
    restart: unless-stopped
    # haruhan-backend의 /metrics를 스크레이프한다. 대시보드 UI는 아직 아무도 안 쓰므로
    # 외부 포트는 열지 않는다 (필요하면 SSH 터널로 접근).
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - haruhan-backend
    networks:
      - haruhan-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: haruhan-grafana
    restart: unless-stopped
    # Prometheus 데이터소스는 자동 프로비저닝되지만, 대시보드 패널 구성은 사람이
    # 직접 만든다 (이번 자동화 범위 밖). 사람이 실제로 들여다볼 UI라 호스트 포트를 연다.
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - haruhan-net

  caddy:
    image: caddy:2-alpine
    container_name: haruhan-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 발급받을 도메인 (예: api.haruhan.example.com). DNS가 이 서버 IP를 가리켜야
      # Let's Encrypt HTTP-01 챌린지가 통과해서 인증서가 자동 발급/갱신된다.
      - DOMAIN=${DOMAIN:?DOMAIN must be set (e.g. api.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - haruhan-backend
    networks:
      - haruhan-net

# 외부 bridge 네트워크 대신, compose가 알아서 사용자 정의 네트워크를 만들도록 수정
networks:
  haruhan-net:
    driver: bridge
  # Ollama 등 다른 스택과 같은 네트워크에서 통신하기 위한 외부 네트워크.
  # Portainer에서 미리 만들어둔 네트워크를 그대로 참조한다 (여기서 새로 만들지 않음).
  mindul-net:
    external: true

volumes:
  # Let's Encrypt 인증서/계정 정보. 컨테이너 재배포해도 유지되도록 볼륨에 저장한다
  # (없으면 재배포 때마다 인증서를 새로 발급받으려다 rate limit에 걸릴 수 있음).
  caddy_data:
  caddy_config:
  # 시계열 데이터/대시보드 설정도 재배포 후에 유지되도록 볼륨에 저장한다.
  prometheus_data:
  grafana_data: